[package]
name = "Just-Wifi-Menu"
version = "0.1.0"
edition = "2024"
description = "Menu Wi-Fi customizável para Hyprland/Wayland em Rust, GTK4, Relm4 e zbus"
repository = "https://github.com/Thaylor-Hugo/Just-Wifi-Menu"

[dependencies]
clap = { version = "4", features = ["derive"] }
gtk = { version = "0.10.1", package = "gtk4", features = ["v4_20"] }
gtk4-layer-shell = "0.7"
relm4 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "4.0", features = ["blocking"] } # The D-Bus library
tokio = { version = "1", features = ["full"] } # The Async runtime
futures = "0.3" # Helpers for streams